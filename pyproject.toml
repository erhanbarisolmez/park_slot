[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "park-slot"
version = "0.1.0"
description = "Otopark doluluk tespit sistemi - CNN tabanlı"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "websockets>=12.0",
    "onnx>=1.14",
    "onnxruntime>=1.15",
    "yt-dlp>=2024.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]
