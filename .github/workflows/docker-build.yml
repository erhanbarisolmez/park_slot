name: Build and push image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/**"
      - "config/**"
      - "data/exports/**"
      - "data/models_cam1/**"
      - "data/models_cam2/**"
      - "data/models_cam3/**"
      - "requirements.txt"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/erhanbarisolmez/park_slot:latest
            ghcr.io/erhanbarisolmez/park_slot:${{ github.sha }}
