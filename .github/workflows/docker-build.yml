name: Build and push image
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/**"
      - "config/**"
      - "data/exports/**"
      - "data/models_cam1/**"
      - "data/models_cam2/**"
      - "data/models_cam3/**"
      - "requirements.txt"
permissions:
  contents: write
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/erhanbarisolmez/park_slot:latest
            ghcr.io/erhanbarisolmez/park_slot:${{ github.sha }}
      - name: Bump image tag in k8s manifests (ArgoCD auto-sync tetikler)
        run: |
          sed -i "s|image: ghcr.io/erhanbarisolmez/park_slot:.*|image: ghcr.io/erhanbarisolmez/park_slot:${{ github.sha }}|" k8s/cam1.yaml k8s/cam2.yaml k8s/cam3.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/cam1.yaml k8s/cam2.yaml k8s/cam3.yaml
          git diff --cached --quiet || git commit -m "deploy: ghcr.io/erhanbarisolmez/park_slot:${{ github.sha }}"
          git push
