# Ansible'ın her komutta "inventory dosyası nerede, nasıl davranayım" diye sorduğu ayar dosyası
[defaults]
# -i inventory.ini yazmaya gerek kalmasın diye varsayılan inventory burada sabitlendi
inventory = inventory.ini
# ilk SSH bağlantısında çıkan "bu host'u tanımıyorum, devam edeyim mi? (yes/no)" sorusunu
# kapatıyor - bu soru otomasyonda (ansible-playbook) prompt'ta takılıp kalır
host_key_checking = False
