# Hem master (localhost) hem worker'lara uygulanan ortak ayarlar.
# k3s trafiğinin LAN üzerinden serbestçe akması için açılması gereken portlar -
# join-k3s.yml'deki ufw task'ları bu listeyi kullanır.
k3s_firewall_ports:
  - { port: "6443", proto: "tcp" }   # k3s API server
  - { port: "8472", proto: "udp" }   # flannel vxlan (pod-to-pod ağı)
  - { port: "10250", proto: "tcp" }  # kubelet API
