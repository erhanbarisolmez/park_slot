apiVersion: apps/v1
kind: Deployment
metadata:
  name: park-slot-cam1
  namespace: park-slot
  labels:
    app: park-slot
    camera: cam1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: park-slot
      camera: cam1
  template:
    metadata:
      labels:
        app: park-slot
        camera: cam1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        hardware: highmem
      containers:
        - name: park-slot
          image: ghcr.io/erhanbarisolmez/park_slot:c223c50e068fe8d93b32c717b5c1aed607b779da
          imagePullPolicy: Always
          args: ["--config", "config/cam1.yaml", "--slots", "config/slots/cam1.json"]
          ports:
            - containerPort: 8000
          env:
            - name: CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
                  divisor: "1"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: data-logs
              mountPath: /app/data/logs
            - name: labeled-data
              mountPath: /app/data/labeled_cam1
      volumes:
        - name: logs
          emptyDir: {}
        # PredictionLog'un JSONL'i (quality/drift metrikleri) burada - emptyDir
        # pod restart/reschedule'da kaybolur, hostPath ile node'da kalıcı
        # olur (nodeSelector: hardware=highmem ile zaten tek node'a sabit).
        - name: data-logs
          hostPath:
            path: /var/lib/park-slot/cam1/logs
            type: DirectoryOrCreate
        # Operatör override feedback loop'unun kaydettiği eğitim verisi
        # (bkz. Pipeline.save_override_label) - emptyDir olsaydı restart'ta
        # kaybolurdu, bu da C3'teki data-logs ile aynı gerekçe.
        - name: labeled-data
          hostPath:
            path: /var/lib/park-slot/cam1/labeled
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: park-slot-cam1
  namespace: park-slot
spec:
  type: NodePort
  selector:
    app: park-slot
    camera: cam1
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
