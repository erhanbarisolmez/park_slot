apiVersion: apps/v1
kind: Deployment
metadata:
  name: park-slot-cam2
  namespace: park-slot
  labels:
    app: park-slot
    camera: cam2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: park-slot
      camera: cam2
  template:
    metadata:
      labels:
        app: park-slot
        camera: cam2
    spec:
      nodeSelector:
        hardware: highmem
      containers:
        - name: park-slot
          image: ghcr.io/erhanbarisolmez/park_slot:411949405f7d3cb821197d864c5f79c22954dab1
          imagePullPolicy: Always
          args: ["--config", "config/cam2.yaml", "--slots", "config/slots/cam2.json"]
          ports:
            - containerPort: 8001
          env:
            - name: CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
                  divisor: "1"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: data-logs
              mountPath: /app/data/logs
      volumes:
        - name: logs
          emptyDir: {}
        # PredictionLog'un JSONL'i (quality/drift metrikleri) burada - emptyDir
        # pod restart/reschedule'da kaybolur, hostPath ile node'da kalıcı
        # olur (nodeSelector: hardware=highmem ile zaten tek node'a sabit).
        - name: data-logs
          hostPath:
            path: /var/lib/park-slot/cam2/logs
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: park-slot-cam2
  namespace: park-slot
spec:
  type: NodePort
  selector:
    app: park-slot
    camera: cam2
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30082
