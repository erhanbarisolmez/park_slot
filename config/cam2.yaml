# cam2 için canlı izleme konfigürasyonu
capture:
  source_type: "youtube"
  source_url: "https://www.youtube.com/watch?v=5E84M6cSJME"
  frame_interval: 1.5
  resolution: [1280, 720]
# Model ayarları
model:
  input_size: 64
  checkpoint_path: "data/models_cam2/best.pth"
  onnx_path: "data/exports/cam2_model.onnx"
  confidence_threshold: 0.7
# Araç tespiti (hibrit düzeltme, torchvision/BSD - bkz. inference/vehicle_detector.py)
detector:
  enabled: true
  model_path: "fasterrcnn_mobilenet_v3_large_320_fpn"
  imgsz: 416
  conf_threshold: 0.4
  interval: 3
# Eğitim ayarları (bu config'te kullanılmıyor, referans)
training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  early_stopping_patience: 7
  train_split: 0.8
  data_dir: "data/labeled_cam2"
# Çıkarım ayarları
inference:
  device: "cpu"
# API ayarları (cam1 ile aynı anda çalışabilmesi için farklı port)
api:
  host: "0.0.0.0"
  port: 8001
  cors_origins: ["*"]
# selfpark-backend'e MQTT yayını (camera_code backend'de önceden kayıtlı olmalı)
mqtt:
  enabled: false
  broker_host: "localhost"
  broker_port: 1883
  camera_code: "CAM-002"
  qos: 1
