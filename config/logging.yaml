version: 1
disable_existing_loggers: false

formatters:
  json:
    class: park_slot.utils.logging_json.JsonFormatter
  text:
    class: logging.Formatter
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    # stdout - kubectl logs/log shipper'ların yakaladığı asıl çıktı, bu
    # yüzden file handler'la aynı (gerçek) json formatter kullanıyor.
    formatter: json
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: json
    filename: logs/app.log
    maxBytes: 10485760
    backupCount: 3

loggers:
  park_slot:
    level: INFO
    handlers: [console, file]
    propagate: false

root:
  level: WARNING
  handlers: [console]
